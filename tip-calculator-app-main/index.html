<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tip-calculator-app-main</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Manrope:wght@200..800&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Space+Grotesk:wght@300..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
    rel="stylesheet">
</head>

<body>
  <div id="app" class="app">
    <h1 class="heading">Spli <br> tter</h1>

    <main class="main">
      <section class="tip-calculator" aria-label="Tip Calculator">

        <form class="tip-calculator__form">

          <div class="tip-calculator__column">

            <div class="tip-calculator__input-group">
              <label for="bill-input" class="tip-calculator__label">Bill</label>
              <div class="tip-calculator__input-wrapper">
                <svg class="tip-calculator__icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="11"
                  height="17">
                  <path fill="#9EBBBD"
                    d="M6.016 16.328v-1.464c1.232-.08 2.22-.444 2.964-1.092.744-.648 1.116-1.508 1.116-2.58v-.144c0-.992-.348-1.772-1.044-2.34-.696-.568-1.708-.932-3.036-1.092V4.184c.56.144 1.012.4 1.356.768.344.368.516.816.516 1.344v.288h1.824v-.432c0-.448-.088-.876-.264-1.284a3.783 3.783 0 00-.744-1.116A4.251 4.251 0 007.54 2.9a5.324 5.324 0 00-1.524-.492V.872H4.288V2.36a5.532 5.532 0 00-1.416.324c-.448.168-.84.392-1.176.672-.336.28-.604.616-.804 1.008-.2.392-.3.844-.3 1.356v.144c0 .96.316 1.708.948 2.244.632.536 1.548.884 2.748 1.044v3.912c-.704-.16-1.248-.472-1.632-.936-.384-.464-.576-1.08-.576-1.848v-.288H.256v.576c0 .464.08.924.24 1.38.16.456.404.88.732 1.272.328.392.744.728 1.248 1.008s1.108.476 1.812.588v1.512h1.728zM4.288 7.424c-.688-.128-1.164-.332-1.428-.612-.264-.28-.396-.644-.396-1.092 0-.464.176-.832.528-1.104.352-.272.784-.448 1.296-.528v3.336zm1.728 5.712V9.344c.768.128 1.328.328 1.68.6.352.272.528.688.528 1.248 0 .544-.196.984-.588 1.32-.392.336-.932.544-1.62.624z" />
                </svg>
                <input type="number" id="bill-input" class="tip-calculator__input" placeholder="0" min="0" step="0.01"
                  inputmode="decimal" required>
              </div>
            </div>

            <fieldset class="tip-calculator__tip-container">
              <legend class="tip-calculator__label">Select Tip %</legend>
              <div class="tip-calculator__tip-options-container">
                <button type="button" class="tip-calculator__tip-option" data-tip="5">5%</button>
                <button type="button" class="tip-calculator__tip-option" data-tip="10">10%</button>
                <button type="button" class="tip-calculator__tip-option" data-tip="15">15%</button>
                <button type="button" class="tip-calculator__tip-option" data-tip="25">25%</button>
                <button type="button" class="tip-calculator__tip-option" data-tip="50">50%</button>

                <label for="custom-tip-input" class="sr-only">Custom Tip Percentage</label>
                <input type="number" id="custom-tip-input"
                  class="tip-calculator__input tip-calculator__tip-option--custom" data-tip="" placeholder="Custom"
                  min="0" step="1" inputmode="numeric">
              </div>
            </fieldset>

            <div class="tip-calculator__input-group">
              <div class="tip-calculator__label-wrapper">
                <label for="people-input" class="tip-calculator__label">Number of People</label>
                <span class="tip-calculator__error-message" id="people-error" aria-live="polite"></span>
              </div>

              <div class="tip-calculator__input-wrapper">
                <svg class="tip-calculator__icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="13"
                  height="16">
                  <path fill="#9EBBBD"
                    d="M9.573 7.729c.406 0 .784.07 1.126.209.342.14.639.33.881.569.232.227.438.503.614.82a5.1 5.1 0 01.407.949c.097.312.178.654.242 1.016.062.359.105.699.126 1.011.02.307.031.624.031.945 0 .836-.259 1.512-.768 2.01-.504.492-1.17.742-1.98.742H2.748c-.81 0-1.477-.25-1.98-.742C.259 14.76 0 14.084 0 13.248c0-.322.01-.64.032-.945.02-.312.063-.652.126-1.01.063-.363.144-.705.242-1.017.1-.323.238-.643.407-.948.176-.318.382-.594.613-.821.243-.238.54-.43.882-.57.342-.138.72-.208 1.125-.208.16 0 .313.067.61.265.183.123.397.264.636.421.204.134.48.259.822.372.333.11.671.167 1.005.167a3.19 3.19 0 001.006-.167c.341-.113.618-.238.822-.372l.636-.42c.296-.2.45-.266.61-.266zM6.598 0C7.63 0 8.522.38 9.252 1.129s1.1 1.666 1.1 2.724c0 1.06-.37 1.976-1.1 2.725-.73.75-1.623 1.13-2.654 1.13-1.03 0-1.924-.38-2.653-1.13-.73-.749-1.1-1.666-1.1-2.725 0-1.058.37-1.975 1.1-2.724C4.675.379 5.567 0 6.598 0z" />
                </svg>
                <input type="number" id="people-input" class="tip-calculator__input" placeholder="0" min="1" step="1"
                  inputmode="numeric" aria-describedby="people-error" required>
              </div>
            </div>

          </div>

          <div class="tip-calculator__result">

            <div class="tip-calculator__result-row">
              <div class="tip-calculator__result-label">
                <h2 class="tip-calculator__result-heading">Tip Amount</h2>
                <span class="tip-calculator__result-subheading">/ person</span>
              </div>
              <output for="bill-input people-input" class="tip-calculator__amount" aria-live="polite">
                $0.00
              </output>
            </div>

            <div class="tip-calculator__result-row">
              <div class="tip-calculator__result-label">
                <h2 class="tip-calculator__result-heading">Total</h2>
                <span class="tip-calculator__result-subheading">/ person</span>
              </div>
              <output for="bill-input people-input" class="tip-calculator__total" aria-live="polite">
                $0.00
              </output>
            </div>


            <button type="reset" class="tip-calculator__reset-button disabled">
              Reset
            </button>

          </div>

        </form>
      </section>
    </main>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
