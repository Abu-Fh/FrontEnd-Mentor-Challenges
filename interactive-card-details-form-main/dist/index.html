<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Manrope:wght@200..800&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Space+Grotesk:wght@300..700&display=swap"
    rel="stylesheet">
  <title>interactive-card-details-form-main</title>
  <script type="module" crossorigin src="/assets/index-TKFJ0vGl.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-CxzPf6pj.css">
</head>

<body>
  <div id="app" class="app">
    <section class="card-details">
      <h1 class="card-details__heading sr-only">Card Details</h1>

      <div class="card-details__main">

        <div class="card-details__previews">

          <div class="card-preview card-preview--back">
            <img aria-hidden="true" src="/images/bg-card-back.png" alt="" class="card-preview__bg">
            <p aria-hidden="true" class="card-preview__cvc">000</p>
          </div>

          <div class="card-preview card-preview--front">
            <img aria-hidden="true" src="/images/bg-card-front.png" alt=""
              class="card-preview__bg card-preview__bg--front">

            <div class="card-preview__content">
              <div class="card-preview__card-logo-container">
                <img aria-hidden="true" src="/images/card-logo.svg" alt="card logo" class="card-preview__card-logo">
              </div>
              <div class="card-preview__main-content">
                <p aria-hidden="true" class="card-preview__number">
                  <span class="card-preview__number-part-1">0000</span>
                  <span class="card-preview__number-part-2">0000</span>
                  <span class="card-preview__number-part-3">0000</span>
                  <span class="card-preview__number-part-4">0000</span>
                </p>

                <div class="card-preview__info">
                  <span class="card-preview__name">JANE APPLESEED</span>
                  <p aria-hidden="true" class="card-preview__expiry">
                    <span class="card-preview__month">00</span>/<span class="card-preview__year">00</span>
                  </p>
                </div>
              </div>
            </div>
          </div>

        </div>

        <form action="/card-confirm" class="card-details__form" novalidate>

          <div class="card-details__form-main-content">
            <div class="card-details__group">
              <label for="card-holder" class="card-details__label">Cardholder Name</label>
              <input type="text" id="card-holder" name="cardHolder" class="card-details__input"
                placeholder="e.g. Jane Appleseed" autocomplete="cc-name">
              <span class="card-details__error" aria-live="polite"></span>
            </div>

            <div class="card-details__group">
              <label for="card-number" class="card-details__label">Card Number</label>
              <input type="text" id="card-number" name="cardNumber" class="card-details__input"
                placeholder="e.g. 1234 5678 9123 0000" maxlength="19" autocomplete="cc-number">
              <span class="card-details__error" aria-live="polite"></span>
            </div>

            <div class="card-details__row">

              <fieldset class="card-details__fieldset">
                <legend class="card-details__label">Exp. Date (MM/YY)</legend>
                <div class="card-details__inputs-inline">
                  <input type="text" id="exp-date-month" name="expDateMonth" class="card-details__input"
                    placeholder="MM" maxlength="2" aria-label="Expiration Month" autocomplete="cc-exp-month">
                  <input type="text" id="exp-date-year" name="expDateYear" class="card-details__input" placeholder="YY"
                    maxlength="2" aria-label="Expiration Year" autocomplete="cc-exp-year">
                </div>
                <span class="card-details__error" aria-live="polite"></span>
              </fieldset>

              <div class="card-details__group">
                <label for="cvc" class="card-details__label">CVC</label>
                <input type="text" id="cvc" name="cvc" class="card-details__input" placeholder="e.g. 123" maxlength="3"
                  autocomplete="cc-csc">
                <span class="card-details__error" aria-live="polite"></span>
              </div>

            </div>
          </div>

          <div class="card-details__success-message hidden">
            <svg class="card-details__success-icon" width="80" height="80" fill="none"
              xmlns="http://www.w3.org/2000/svg">
              <circle cx="40" cy="40" r="40" fill="url(#a)" />
              <path d="M28 39.92 36.08 48l16-16" stroke="#fff" stroke-width="3" />
              <defs>
                <linearGradient id="a" x1="-23.014" y1="11.507" x2="0" y2="91.507" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#6348FE" />
                  <stop offset="1" stop-color="#610595" />
                </linearGradient>
              </defs>
            </svg>

            <p class="card-details__success-thanks">Thank you!</p>
            
            <strong class="card-details__success-strong">
              We've added your card details
            </strong>
          </div>

          <button type="submit" class="card-details__submit">Confirm</button>

        </form>
      </div>
    </section>
  </div>
</body>

</html>
